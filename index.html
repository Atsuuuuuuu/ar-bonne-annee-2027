<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner de QR code</title>
</head>
<body>
  <h1>Scanner de QR code</h1>
  <p>Autorisez la caméra puis visez un QR code.</p>

  <button id="start-scan" type="button">Démarrer le scan</button>
  <button id="stop-scan" type="button" disabled>Arrêter le scan</button>

  <div id="reader"></div>

  <h2>Résultat</h2>
  <p id="scan-result">Aucun QR code détecté.</p>
  <p id="scan-error"></p>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const startButton = document.getElementById('start-scan');
    const stopButton = document.getElementById('stop-scan');
    const resultElement = document.getElementById('scan-result');
    const errorElement = document.getElementById('scan-error');

    const scanner = new Html5Qrcode('reader');
    let running = false;

    async function startScan() {
      if (running) {
        return;
      }

      errorElement.textContent = '';
      resultElement.textContent = 'Scan en cours...';

      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: 250 },
          (decodedText) => {
            resultElement.textContent = decodedText;
          },
          () => {}
        );

        running = true;
        startButton.disabled = true;
        stopButton.disabled = false;
      } catch (error) {
        resultElement.textContent = 'Aucun QR code détecté.';
        errorElement.textContent = 'Impossible de démarrer la caméra : ' + (error && error.message ? error.message : error);
      }
    }

    async function stopScan() {
      if (!running) {
        return;
      }

      try {
        await scanner.stop();
        await scanner.clear();
      } catch (error) {
        errorElement.textContent = 'Erreur lors de l\'arrêt du scanner : ' + (error && error.message ? error.message : error);
      } finally {
        running = false;
        startButton.disabled = false;
        stopButton.disabled = true;
      }
    }

    startButton.addEventListener('click', startScan);
    stopButton.addEventListener('click', stopScan);

    window.addEventListener('beforeunload', () => {
      if (running) {
        scanner.stop().catch(() => {});
      }
    });
  </script>
</body>
</html>
